<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Проездной</title>
    <link rel="manifest" href="manifest.json?v=10">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎫</text></svg>">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="stylesheet" href="style.css?v=10">
</head>
<body>
    <div id="app">
        <div class="screen active">
            <div class="header">
                <h1>🎫 Проездной</h1>
                <div class="header-buttons">
                    <button id="btn-theme" class="btn-theme">🌙</button>
                    <a href="index.html" class="btn-link">← Назад</a>
                </div>
            </div>

            <div id="pass-active-card" class="card hidden">
                <div id="pass-expired-banner" class="banner banner-warn hidden">Проездной истёк!</div>
                <div id="pass-lost-banner" class="banner banner-lost hidden">Проездной потерян</div>
                <div class="pass-header-row">
                    <div id="pass-info-text" class="pass-info-line"></div>
                    <button id="btn-pass-settings" class="btn-pass-settings hidden">⚙️</button>
                </div>
                <div class="progress-bar">
                    <div id="pass-progress-fill" class="progress-fill"></div>
                </div>
                <div id="pass-progress-text" class="pass-progress-text"></div>
                <div id="pass-remaining" class="pass-remaining"></div>
                <div id="pass-settings-menu" class="pass-settings-menu hidden">
                    <button id="btn-lose-pass" class="pass-settings-item pass-settings-lost">Потерян</button>
                    <button id="btn-restore-pass" class="pass-settings-item pass-settings-restore hidden">Восстановить</button>
                    <button id="btn-delete-pass" class="pass-settings-item pass-settings-delete">Удалить</button>
                </div>
            </div>

            <div id="pass-create-section">
                <div class="section-title">Новый проездной</div>

                <div class="form-group">
                    <label>Тип</label>
                    <div class="pass-type-buttons">
                        <button class="pass-type-btn selected" data-type="unlimited">Безлимитный</button>
                        <button class="pass-type-btn" data-type="fixed">На N поездок</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>Транспорт</label>
                    <div class="transport-buttons">
                        <button class="transport-btn selected" data-transport="ground">🚌 Наземный</button>
                        <button class="transport-btn" data-transport="metro">🚇 Метро</button>
                        <button class="transport-btn" data-transport="scooter">🛴 Самокат</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>Дата начала</label>
                    <input type="date" id="start-date">
                </div>

                <div id="duration-unlimited" class="form-group">
                    <label>Срок действия</label>
                    <div class="duration-buttons">
                        <button class="duration-btn" data-days="10">10 суток</button>
                        <button class="duration-btn" data-days="15">15 суток</button>
                        <button class="duration-btn selected" data-days="30">30 суток</button>
                    </div>
                </div>

                <div id="duration-fixed" class="form-group hidden">
                    <label>Срок действия</label>
                    <div class="duration-buttons">
                        <button class="duration-btn" data-days="120">120 суток</button>
                        <button class="duration-btn" data-days="365">365 суток</button>
                    </div>
                </div>

                <div id="total-trips-group" class="form-group hidden">
                    <label>Количество поездок</label>
                    <input type="number" id="total-trips-input" placeholder="Например, 60" min="1">
                </div>

                <div class="form-group">
                    <label>Стоимость проездного (BYN)</label>
                    <input type="number" id="pass-price" placeholder="Например, 65.84" min="0.01" step="0.01">
                </div>

                <button id="btn-create-pass" class="btn-primary">Создать проездной</button>
            </div>

            <div id="pass-history-section" class="hidden">
                <div class="section-title" style="margin-top: 24px;">История</div>
                <div id="pass-history-list" class="card"></div>
            </div>
        </div>
    </div>
    <script src="pass.js?v=10"></script>
</body>
</html>
