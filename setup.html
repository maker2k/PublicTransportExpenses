<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Настройки</title>
    <link rel="manifest" href="manifest.json?v=10">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎫</text></svg>">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="stylesheet" href="style.css?v=10">
</head>
<body>
    <div id="app">
        <div class="screen active">
            <div class="header">
                <h1>⚙️ Настройки</h1>
                <div class="header-buttons">
                    <button id="btn-theme" class="btn-theme">🌙</button>
                    <a href="index.html" class="btn-link">← Назад</a>
                </div>
            </div>

            <div class="section-title">Цены за поездку</div>

            <div class="card">
                <div class="form-group">
                    <label>🚌 Наземный, предоплата (BYN)</label>
                    <input type="number" id="price-ground-prepaid" min="0" step="0.01">
                </div>
                <div class="form-group">
                    <label>🚌 Наземный, наличные (BYN)</label>
                    <input type="number" id="price-ground-cash" min="0" step="0.01">
                </div>
                <div class="form-group">
                    <label>🚇 Метро (BYN)</label>
                    <input type="number" id="price-metro" min="0" step="0.01">
                </div>
                <button id="btn-save-prices" class="btn-primary">Сохранить цены</button>
            </div>

            <div class="section-title" style="margin-top: 24px;">Кнопки на главной</div>

            <div class="card">
                <div class="form-group">
                    <label>Кнопки на главной</label>
                    <div class="transport-buttons" id="optional-transports">
                        <button class="transport-btn" data-transport="ground">🚌 Наземный</button>
                        <button class="transport-btn" data-transport="metro">🚇 Метро</button>
                        <button class="transport-btn" data-transport="carsharing">🚗 Каршеринг</button>
                        <button class="transport-btn" data-transport="taxi">🚕 Такси</button>
                        <button class="transport-btn" data-transport="scooter">🛴 Самокат</button>
                    </div>
                </div>
                <button id="btn-save-transports" class="btn-primary">Сохранить</button>
            </div>

            <div class="section-title" style="margin-top: 24px;">Данные</div>

            <div class="card">
                <button id="btn-reset" class="btn-reset">Сбросить все поездки и проездные</button>
            </div>
        </div>
    </div>
    <script src="setup.js?v=10"></script>
</body>
</html>
